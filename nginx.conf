events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;
        server_name hannom.lyvuha.com;

        # Frontend Routing
        location / {
            proxy_pass http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # Backend API Routing (matches FastAPI's router)
        location /api/v1/ {
            proxy_pass http://backend:8000/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Backend Swagger/OpenAPI docs
        location /docs {
            proxy_pass http://backend:8000/docs;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            proxy_pass http://backend:8000/openapi.json;
            proxy_set_header Host $host;
        }
    }

    server {
        listen 80;
        server_name tradulieu.lyvuha.com;

        # Bigdata Core API (8001)
        location /api/ {
            proxy_pass http://bd_legal_core_api:8001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Bigdata RAG Engine (8002)
        location /rag/ {
            proxy_pass http://bd_legal_ai_engine:8002/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Swagger Docs for Bigdata
        location /docs {
            proxy_pass http://bd_legal_core_api:8001/docs;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            proxy_pass http://bd_legal_core_api:8001/openapi.json;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://bd_legal_frontend:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
